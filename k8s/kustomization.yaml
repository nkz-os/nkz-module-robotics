apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reference templates; the deployed copy lives in the deployment configuration
# repository. Secrets (not included): db-nkz-module-robotics (url, from
# new-module-db), robotics-module-secrets (credential-key = Fernet key,
# zenoh-service-password), plus the platform's jwt-secret and internal-service-secret.
resources:
  - robotics-config.yaml
  - rbac.yaml
  - backend-deployment.yaml
  - backend-svc.yaml
  - zenoh-configmap.yaml
  - zenoh-deployment.yaml
  - zenoh-svc.yaml
  - zenoh-network-policy.yaml
