# One replica only: live robot state and the Zenoh session are in memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotics-api
  namespace: nekazari
  labels:
    app: robotics-api
    module: robotics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: robotics-api
  template:
    metadata:
      labels:
        app: robotics-api
        module: robotics
        nkz-os.org/keycloak-client: "true"
        nkz-os.org/orion-client: "true"
        nkz-os.org/postgres-client: "true"
    spec:
      serviceAccountName: robotics-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Schema migrations run before the API starts; the API container does no DDL.
        - name: migrate
          image: ghcr.io/nkz-os/nkz-module-robotics/robotics-backend:YOUR_IMAGE_TAG
          command: ["python", "-m", "app.db.migrate"]
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: db-nkz-module-robotics
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          image: ghcr.io/nkz-os/nkz-module-robotics/robotics-backend:YOUR_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: robotics-config
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: db-nkz-module-robotics
                  key: url
            - name: ROBOTICS_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: robotics-module-secrets
                  key: credential-key
            - name: ZENOH_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: robotics-module-secrets
                  key: zenoh-service-password
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: INTERNAL_SERVICE_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: jwt_issuer
            - name: JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: jwks_url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: cors_origins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
