apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotics-api
  namespace: nekazari
  labels:
    app: robotics-api
    module: robotics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotics-api
  template:
    metadata:
      labels:
        app: robotics-api
        module: robotics
    spec:
      containers:
        - name: api
          image: ghcr.io/nkz-os/nkz-module-robotics/robotics-backend@sha256:e03c96adadd929707ddcfa3071b02509189c2055e26447379d40e83d5be333dc
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: ORION_URL
              value: "http://orion-ld-service:1026"
            - name: ZENOH_REST_URL
              value: "http://zenoh-service:8000"
            # Zenoh 1.0 has no admin REST API for dynamic user/ACL provisioning
            # (confirmed against upstream docs) — auth is a static per-tenant
            # usrpwd dictionary, see zenoh-configmap.yaml + the
            # zenoh-tenant-credentials volume mount below.
            # ASSUMPTION: DNS (zenoh-service.nekazari.svc.cluster.local) is
            # NOT resolvable over the VPN (headscale magic_dns is disabled).
            # Override with the real zenoh-service ClusterIP before robots
            # rely on this in the field; ask a cluster operator for it.
            # - name: ZENOH_ROBOT_ENDPOINT
            #   value: "tcp/<zenoh-service-cluster-ip>:7447"
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: keycloak_url
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: jwt_issuer
            - name: JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: jwks_url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: cors_origins
          volumeMounts:
            - name: zenoh-tenant-credentials
              mountPath: /zenoh-credentials
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: zenoh-tenant-credentials
          secret:
            secretName: zenoh-tenant-credentials
            optional: true
