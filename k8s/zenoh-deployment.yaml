# Zenoh router for field robots. Robots reach it over the VPN at the fixed
# ClusterIP of zenoh-service with a per-robot usrpwd credential; the ACL limits
# each robot to its own nkz/<tenant>/<uuid>/ keys. robotics-api writes the
# Secret zenoh-acl from its database and restarts this Deployment by annotating
# its pod template (robotics.nkz-os.org/acl-digest). Single replica: a restart
# drops every robot link for a few seconds (accepted in preproduction).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenoh-router
  namespace: nekazari
  labels:
    app: zenoh-router
    module: robotics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zenoh-router
  template:
    metadata:
      labels:
        app: zenoh-router
        module: robotics
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: merge-config
          image: busybox:1.37
          command: ["sh", "/base/merge.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: base
              mountPath: /base
              readOnly: true
            - name: acl
              mountPath: /acl
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: zenoh-router
          image: eclipse/zenoh:1.10.1
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/zenoh.json5"]
          ports:
            - name: zenoh
              containerPort: 7447
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: zenoh
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: zenoh
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: base
          configMap:
            name: zenoh-config
        - name: acl
          secret:
            secretName: zenoh-acl
            optional: true
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
