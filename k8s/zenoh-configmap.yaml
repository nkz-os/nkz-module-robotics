apiVersion: v1
kind: ConfigMap
metadata:
  name: zenoh-config
  namespace: nekazari
  labels:
    app: zenoh-router
    module: robotics
data:
  zenoh.json5: |
    // Base router configuration. The initContainer replaces the ACCESS_CONTROL
    // marker line with access_control.json5 from the Secret zenoh-acl (written by
    // robotics-api from its database) and copies its credentials.txt next to it.
    // Without that Secret the router starts with nobody allowed (deny-all).
    {
      mode: "router",
      listen: { endpoints: ["tcp/0.0.0.0:7447"] },
      scouting: { multicast: { enabled: false }, gossip: { enabled: false } },
      transport: {
        auth: { usrpwd: { dictionary_file: "/config/credentials.txt" } }
      },
      access_control:
        __ACCESS_CONTROL__
      ,
      plugins_loading: { enabled: false }
    }
  deny.json5: |
    { "enabled": true, "default_permission": "deny", "rules": [], "subjects": [], "policies": [] }
  merge.sh: |
    set -eu
    if [ -s /acl/access_control.json5 ]; then ac=/acl/access_control.json5; else ac=/base/deny.json5; fi
    awk -v f="$ac" '/__ACCESS_CONTROL__/ { while ((getline line < f) > 0) print line; next } { print }' /base/zenoh.json5 > /config/zenoh.json5
    if [ -f /acl/credentials.txt ]; then cp /acl/credentials.txt /config/credentials.txt; else : > /config/credentials.txt; fi
    echo "zenoh config: acl=$ac users=$(grep -c . /config/credentials.txt || true)"
