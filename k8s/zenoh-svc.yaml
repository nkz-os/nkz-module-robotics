# Fixed ClusterIP: robots are given tcp/<this IP>:7447 (ZENOH_ROBOT_ENDPOINT in
# robotics-config); cluster DNS is not resolvable over the VPN.
apiVersion: v1
kind: Service
metadata:
  name: zenoh-service
  namespace: nekazari
  labels:
    app: zenoh-router
    module: robotics
spec:
  type: ClusterIP
  clusterIP: YOUR_ZENOH_CLUSTER_IP  # pick a free IP in the service CIDR
  selector:
    app: zenoh-router
  ports:
    - name: zenoh
      port: 7447
      targetPort: 7447
      protocol: TCP
