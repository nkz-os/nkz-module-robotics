# Pull requests: backend lint + tests against a real PostgreSQL and a real Zenoh
# router, frontend typecheck + tests + MF2 build. Push to main additionally
# builds and pushes the backend image (full-SHA tag) and publishes the frontend
# through the platform's OIDC publish workflow.
name: Build and Push

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE: ghcr.io/${{ github.repository }}/robotics-backend

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:14
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run typecheck

            - name: Frontend tests
              run: pnpm test

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: backend/requirements-dev.txt

            - name: Install backend dependencies
              run: pip install -r backend/requirements-dev.txt

            - name: Lint backend
              run: cd backend && ruff check app tests

            - name: Pull the Zenoh router for integration tests
              run: docker pull eclipse/zenoh:1.10.1

            - name: Run backend tests (incl. real router isolation)
              env:
                  TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
                  ZENOH_TEST_ROUTER: "1"
              run: cd backend && python -m pytest tests/ -q

    build-module:
        name: Build MF2 Bundle
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - uses: pnpm/action-setup@v4
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build:module
              env:
                  NKZ_VERSION_HASH: ${{ github.sha }}
            - uses: actions/upload-artifact@v4
              with:
                  name: nkz-module
                  path: dist/
                  retention-days: 30

    build-backend:
        name: Build Backend Image
        runs-on: ubuntu-latest
        needs: test
        if: ${{ github.event_name != 'pull_request' }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.BACKEND_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=sha,format=long,prefix=
            - uses: docker/build-push-action@v5
              with:
                  context: backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    publish-module:
        name: Publish Module
        needs: test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        permissions:
            id-token: write
            contents: read
        uses: nkz-os/nkz/.github/workflows/_publish-module.yml@main
        with:
            module_id: "robotics"
